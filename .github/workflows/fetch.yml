name: Fetch funding opportunities

on:
  schedule:
    # Every day at 23:17 UTC = 06:17 Bangkok time. Edit to change.
    # (Per-source frequency is set with `schedule:` in config/sources.yaml.)
    - cron: "17 23 * * *"
  workflow_dispatch:            # "Run workflow" button in the Actions tab
    inputs:
      mode:
        description: "due = respect per-source schedules, all = fetch everything"
        default: due
        type: choice
        options: [due, all]
      source:
        description: "Optional: only this source id (e.g. eu_portal)"
        required: false
  push:
    paths: ["config/**", "data/manual.yaml", "data/pipeline.yaml", "tracker/**"]

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests (offline)
        run: pytest -q

      - name: Fetch
        env:
          TZ: Asia/Bangkok
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.mode }}" = "all" ]; then ARGS="--all"; fi
          if [ -n "${{ github.event.inputs.source }}" ]; then ARGS="--source ${{ github.event.inputs.source }}"; fi
          python -m tracker run $ARGS

      - name: Commit results
        run: |
          git config user.name  "funding-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ exports/ reports/ docs/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: update $(TZ=Asia/Bangkok date +'%Y-%m-%d %H:%M') [skip ci]"
          git pull --rebase --autostash
          git push
